# PaboNaki Spring Boot configuration
# Secrets are supplied only through environment variables (Render Environment).
spring.application.name=pabonaki-api
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8080}
app.setup-token=${PABONAKI_SETUP_TOKEN:}
app.seed-demo=${PABONAKI_SEED_DEMO:false}
app.delivery.dhaka=${DELIVERY_DHAKA:80}
app.delivery.outside-dhaka=${DELIVERY_OUTSIDE_DHAKA:130}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.integrations.gemini-key=${GEMINI_API_KEY:}
app.integrations.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
app.integrations.google-client-id=${GOOGLE_CLIENT_ID:}
app.integrations.support-email=${SUPPORT_EMAIL:}
app.integrations.resend-key=${RESEND_API_KEY:}
app.integrations.email-from=${EMAIL_FROM:}
app.integrations.brevo-key=${BREVO_API_KEY:}
app.integrations.brevo-sender-email=${BREVO_SENDER_EMAIL:}
app.integrations.brevo-sender-name=${BREVO_SENDER_NAME:PaboNaki}

app.integrations.cloudinary-cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.integrations.cloudinary-api-key=${CLOUDINARY_API_KEY:}
app.integrations.cloudinary-api-secret=${CLOUDINARY_API_SECRET:}

app.integrations.pathao-base-url=${PATHAO_BASE_URL:https://courier-api-sandbox.pathao.com}
app.integrations.pathao-client-id=${PATHAO_CLIENT_ID:}
app.integrations.pathao-client-secret=${PATHAO_CLIENT_SECRET:}
app.integrations.pathao-username=${PATHAO_USERNAME:}
app.integrations.pathao-password=${PATHAO_PASSWORD:}
app.integrations.pathao-store-id=${PATHAO_STORE_ID:}
app.integrations.pathao-city-id=${PATHAO_CITY_ID:}
app.integrations.pathao-zone-id=${PATHAO_ZONE_ID:}
app.integrations.pathao-area-id=${PATHAO_AREA_ID:}

app.integrations.sslcommerz-base-url=${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
app.integrations.sslcommerz-store-id=${SSLCOMMERZ_STORE_ID:}
app.integrations.sslcommerz-store-password=${SSLCOMMERZ_STORE_PASSWORD:}

# Retained for compatibility only. Render Free blocks outbound SMTP; Brevo HTTPS API is preferred.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.integrations.smtp-from=${SMTP_FROM:${SMTP_USERNAME:}}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.ai.enabled=${AI_FEATURES_ENABLED:true}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:gemini-embedding-2}
app.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:768}
app.ai.daily-embedding-budget=${AI_DAILY_EMBEDDING_BUDGET:2000}
app.ai.visual.max-bytes=${AI_VISUAL_MAX_BYTES:4194304}
app.ai.visual.min-score=${AI_VISUAL_MIN_SCORE:0.35}
app.ai.index.auto=${AI_INDEX_AUTO:true}
app.ai.index.batch=${AI_INDEX_BATCH:20}
app.ai.vector.mode=${AI_VECTOR_MODE:auto}
app.ai.vector.text-index=${AI_VECTOR_TEXT_INDEX:product_text_vector_index}
app.ai.vector.image-index=${AI_VECTOR_IMAGE_INDEX:product_image_vector_index}
app.ai.rate.visual-per-minute=${AI_RATE_VISUAL_PER_MIN:10}
app.ai.rate.semantic-per-minute=${AI_RATE_SEMANTIC_PER_MIN:30}

app.integrations.tryoncloud-key=${TRYONCLOUD_API_KEY:}
